name: Image

# Compile l'image sur les machines de GitHub, pas sur le serveur de
# déploiement : celui-ci n'a plus qu'à tirer environ 7 Mo depuis GHCR.
on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Facultatif : prévient Coolify qu'une nouvelle image est prête.
      # Renseigner les secrets COOLIFY_WEBHOOK et COOLIFY_TOKEN pour l'activer.
      - name: Déclencher le redéploiement Coolify
        if: ${{ secrets.COOLIFY_WEBHOOK != '' }}
        run: |
          curl -fsS -X GET "${{ secrets.COOLIFY_WEBHOOK }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}"
