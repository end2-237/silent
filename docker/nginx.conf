server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Les routes sont exportées en dossiers (/cartes/index.html).
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Le service worker doit toujours être revalidé, sinon une ancienne
    # version de l'application reste collée sur les appareils installés.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { } default_type application/manifest+json;
    }

    # Fichiers au nom haché : immuables.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /icons/ {
        add_header Cache-Control "public, max-age=604800";
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/manifest+json;

    error_page 404 /404.html;
}
