name: Site

# Compile le site et pousse le résultat dans la branche gh-pages, accompagné
# d'un Dockerfile de trois lignes : l'hébergeur n'a plus qu'à poser ces
# fichiers dans un nginx, sans rien construire.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Ajouter le nginx de service
        run: |
          cp deploy/Dockerfile deploy/nginx.conf deploy/.dockerignore out/
          touch out/.nojekyll

      - name: Publier la branche gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f out
          tree=$(git write-tree --prefix=out/)
          commit=$(git commit-tree "$tree" -m "Site compilé depuis ${GITHUB_SHA:0:7}")
          git push -f origin "$commit:refs/heads/gh-pages"
