# Construction Nixpacks (Coolify, Railway…).
#
# Seul Node est installé : npm est celui fourni avec, ce qui évite à nix de
# compiler une dérivation npm séparée. Le résultat est un export statique,
# servi par server.mjs — « next start » ne sait pas servir output: "export".

providers = ["node"]

[phases.setup]
nixPkgs = ["nodejs_22"]

# --include=dev : si NODE_ENV=production est défini sur l'hébergeur, npm
# sauterait les devDependencies et la compilation échouerait faute de
# TypeScript.
[phases.install]
cmds = ["npm ci --include=dev --no-audit --no-fund"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "node server.mjs"
