name: Site

# Compile le site et pousse le résultat dans la branche gh-pages.
# Que des commandes git : rien à activer, rien qui puisse échouer faute de
# réglage dans le dépôt.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # GitHub Pages sert le site sous /<nom-du-dépôt>/.
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      - run: touch out/.nojekyll

      - name: Publier la branche gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f out
          tree=$(git write-tree --prefix=out/)
          commit=$(git commit-tree "$tree" -m "Site compilé depuis ${GITHUB_SHA:0:7}")
          git push -f origin "$commit:refs/heads/gh-pages"
